<!-- Maximilian Matuzani - Media Studies portfolio (Squarespace Code Block loader).
     Paste this whole box into ONE Code Block (with "Display Source Code" switched OFF).
     It loads the full portfolio (Max_Media_Studies_portfolio5.html) from GitHub, so this box stays small;
     to show a newer version later, only the file name / code in PORTFOLIO below needs changing. -->
<div id="mm-root" style="min-height:60vh;background:#08050d"></div>
<script>
(function () {
  var PORTFOLIO = 'https://raw.githubusercontent.com/StefanSendyk/Raqueshi/bd9cc289f7a5691a6a4c28c304e62d7dddf963d1/Max_Media_Studies_portfolio5.html';
  var BACKUP = 'https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@bd9cc289f7a5691a6a4c28c304e62d7dddf963d1/Max_Media_Studies_portfolio5.html';
  var root = document.getElementById('mm-root');
  function get(url) { return fetch(url, { cache: 'force-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }); }
  get(PORTFOLIO).catch(function () { return get(BACKUP); }).then(function (html) {
    root.innerHTML = html;
  }).catch(function () {
    root.innerHTML = '<p style="color:#f6f1ff;font:16px/1.6 system-ui,sans-serif;padding:40px">The portfolio could not load right now. Please refresh the page.</p>';
  });
})();
</script>
