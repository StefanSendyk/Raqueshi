<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aloha Film Awards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #fdfdfb;
    --ink: #111;
    --red: #d42027;
    --sans: 'Helvetica Neue', Helvetica, 'Inter', Arial, sans-serif;
    --logo: 'Archivo Black', 'Arial Black', sans-serif;
    --hand: 'Caveat', cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #1a1a1a; display: grid; place-items: center; grid-template-rows: 1fr auto;
    gap: 14px; padding: 2vh 16px; font-family: var(--sans); }

  /* ---------- the magazine cover: plain white, like a 70s TV listings cover ---------- */
  .cover {
    position: relative; overflow: hidden; container-type: size;
    aspect-ratio: 9 / 16; height: min(88vh, calc((100vw - 32px) * 16 / 9));
    background: var(--white); color: var(--ink);
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .cover.post { aspect-ratio: 4 / 5; height: min(88vh, calc((100vw - 32px) * 5 / 4)); }

  .price { position: absolute; top: 2.6cqh; left: 5cqw; z-index: 5;
    font: 500 3.5cqw/1 var(--sans); letter-spacing: -.01em; }
  .price .dot { display: inline-block; width: .8em; height: .8em; border: .12em solid var(--ink); border-radius: 50%;
    vertical-align: -.05em; margin-right: .25em; position: relative; }
  .price .dot::after { content: ''; position: absolute; inset: .14em; border-radius: 50%; background: var(--ink); }

  .mast { position: absolute; top: 5cqh; left: 5cqw; z-index: 5; width: max-content;
    background: var(--red); color: #fff; border-radius: 3.2cqw; padding: 1.6cqw 3.4cqw 2.4cqw; text-align: center; }
  .mast .big { font: 400 15.5cqw/.9 var(--logo); letter-spacing: -.035em; }
  .mast .small { font: 400 6.8cqw/1 var(--logo); letter-spacing: .03em; margin-top: .4cqw; }

  .lines { position: absolute; left: 5cqw; top: 23cqh; z-index: 5; width: 46cqw; }
  .lines h2 { font: 500 6.7cqw/1.04 var(--sans); letter-spacing: -.025em; }
  .lines .page { font: 500 2.6cqw/1 var(--sans); margin: .7cqh 0 0 22cqw; }
  .lines .sub { font: 500 3.3cqw/1.18 var(--sans); letter-spacing: -.01em; margin-top: 2.2cqh; }
  .lines .sub b { font-weight: 700; color: var(--red); }

  .art { position: absolute; right: -2cqw; bottom: .5cqh; height: 74cqh; z-index: 4; }

  .cover.post .mast { top: 6.6cqh; }
  .cover.post .mast .big { font-size: 11.5cqw; }
  .cover.post .mast .small { font-size: 5cqw; }
  .cover.post .lines { top: 29cqh; width: 36cqw; }
  .cover.post .lines h2 { font-size: 5.4cqw; }
  .cover.post .lines .page { font-size: 2cqw; margin-left: 16cqw; }
  .cover.post .lines .sub { font-size: 2.7cqw; }
  .cover.post .art { height: 80cqh; }

  /* ---------- small life for the reel ---------- */
  .balloon { animation: bob 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes bob { 50% { transform: translate(-6px, -14px) rotate(-3deg); } }
  .bat { animation: flap .45s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes flap { to { transform: scaleY(.35); } }
  .flyA { animation: flyA 9s ease-in-out infinite; }
  .flyB { animation: flyB 11s ease-in-out infinite; }
  @keyframes flyA { 50% { transform: translate(-40px, 20px); } }
  @keyframes flyB { 50% { transform: translate(30px, -25px); } }
  .blink { animation: blink 5s steps(1) infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes blink { 96% { transform: scaleY(.1); } }
  .glint { animation: glint 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes glint { 0%,70%,100% { opacity: 0; transform: scale(.4); } 80% { opacity: 1; transform: scale(1); } }
  .fan { animation: fan 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }
  @keyframes fan { 50% { transform: rotate(6deg); } }

  .controls { display: flex; gap: 8px; }
  .controls button { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px;
    padding: 6px 14px; font: 600 15px var(--sans); cursor: pointer; }
  .controls button[aria-pressed="true"] { background: var(--red); border-color: #ff6a6a; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>

<div class="controls">
  <button id="reel" aria-pressed="true">Reel 9:16</button>
  <button id="post" aria-pressed="false">Post 4:5</button>
</div>

<script>
  // Reel / post format switch
  const cover = document.getElementById('cover');
  const reelBtn = document.getElementById('reel'), postBtn = document.getElementById('post');
  function setFormat(post) {
    cover.classList.toggle('post', post);
    reelBtn.setAttribute('aria-pressed', !post);
    postBtn.setAttribute('aria-pressed', post);
  }
  reelBtn.onclick = () => setFormat(false);
  postBtn.onclick = () => setFormat(true);
</script>
