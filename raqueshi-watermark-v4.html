<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raqueshi Watermark v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Most Wasted";
    src: url("watermark_assets/Mostwasted.ttf") format("truetype");
  }
  :root {
    --key: #00ff00;      /* chroma-key green: remove it with Chroma Key in CapCut */
    --ink: #0a0a0a;
    --red: #d40000;
    --blood: #8a0000;
    --steel: #cfcfcf;
    --paper: #f4f1ea;

    /* timeline (seconds): intro ends ~0.3, outro starts at --out, gone by ~1.5 */
    --out: 1.3s;
  }
  html, body { margin: 0; height: 100%; background: var(--key); overflow: hidden; }
  body { display: grid; place-items: center; }
  svg { width: min(80vmin, 720px); height: auto; overflow: visible; }
  svg * { transform-box: view-box; }

  /* ---------- intro ---------- */
  .emblem { transform-origin: 320px 300px; animation: emblem-in .28s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes emblem-in {
    from { transform: scale(.4) rotate(-60deg); }
    to   { transform: scale(1) rotate(0); }
  }
  .denji { transform-origin: 320px 300px; animation: denji-in .22s ease-out .04s both; }
  @keyframes denji-in { from { transform: translateY(60px) scale(1.15); } to { transform: none; } }

  .slash { transform-origin: 70px 330px; animation: wipe .1s cubic-bezier(.7, 0, .3, 1) .05s both; }
  @keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .name { transform-origin: 320px 330px; animation: stamp .18s cubic-bezier(.3, 1.8, .5, 1) .08s both; }
  @keyframes stamp {
    0%   { transform: scale(1.9) rotate(-6deg); opacity: 0; }
    40%  { opacity: 1; }
    100% { transform: scale(1) rotate(-6deg); opacity: 1; }
  }

  .peek { animation: peek .2s cubic-bezier(.2, 1.8, .4, 1) .1s both; }
  @keyframes peek { from { transform: translateY(110px); } to { transform: translateY(0); } }
  .bob { animation: bob .3s ease-in-out .3s infinite alternate; }
  @keyframes bob { to { transform: translateY(-6px) rotate(-4deg); } }

  /* ---------- outro: name slices away, saw spins out ---------- */
  .outro { transform-origin: 320px 300px; animation: outro .2s cubic-bezier(.6, -0.4, .8, .4) var(--out) both; }
  @keyframes outro {
    from { transform: scale(1) rotate(0); }
    to   { transform: scale(0) rotate(200deg); }
  }
  .name-out { transform-origin: 320px 330px; animation: name-out .12s ease-in var(--out) both; }
  @keyframes name-out {
    from { transform: translateX(0) skewX(0); }
    to   { transform: translateX(260px) skewX(-30deg); }
  }

  /* ---------- loop details ---------- */
  .ring { transform-origin: 320px 300px; animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .idle { animation: idle .1s steps(1) infinite; }
  @keyframes idle {
    0%  { transform: translate(0, 0); }
    25% { transform: translate(1px, -1px); }
    50% { transform: translate(-1px, 1px); }
    75% { transform: translate(1px, 1px); }
  }

  .rev { transform-origin: 320px 300px; animation: rev .16s ease-in-out .28s 1 both; }
  @keyframes rev {
    0%, 100% { transform: none; }
    25% { transform: rotate(-3deg) translate(-5px, 3px); }
    50% { transform: rotate(2.5deg) translate(5px, -4px); }
    75% { transform: rotate(-1.5deg) translate(-3px, 2px); }
  }

  .spatter > * { fill: var(--red); stroke: var(--ink); stroke-width: 2.5; transform: scale(0); animation: splat .15s cubic-bezier(.2, 1.6, .4, 1) .26s both; }
  @keyframes splat { to { transform: scale(1); } }

  .drip { fill: var(--red); transform: scaleY(0); animation: drip .3s ease-out .18s both; }
  @keyframes drip { to { transform: scaleY(1); } }

  .cord { transform-origin: 320px 520px; animation: swing .3s ease-in-out infinite alternate; }
  @keyframes swing { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }

  .name text.word { font-family: "Most Wasted", Impact, sans-serif; font-size: 116px; }

  .hint { position: fixed; left: 16px; bottom: 16px; font: 14px/1.4 -apple-system, system-ui, sans-serif; color: #000; background: #fff; padding: 8px 12px; border-radius: 6px; animation: hide .4s ease 4s forwards; }
  @keyframes hide { to { opacity: 0; visibility: hidden; } }
</style>
</head>
<body>

<template id="mark">
<svg viewBox="-40 -60 720 720" aria-label="Raqueshi">
  <defs>
    <path id="tooth" d="M308 58 L309 47 L336 32 L331 58 Z"
          fill="var(--steel)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
    <path id="diamond" d="M0 -7 L7 0 L0 7 L-7 0 Z" fill="var(--red)"/>
    <clipPath id="inside"><circle cx="320" cy="300" r="236"/></clipPath>
  </defs>

  <g class="outro">
  <g class="rev">
    <g class="idle">
      <g class="emblem">

        <!-- Pochita, sitting behind the top-right of the saw -->
        <g transform="translate(468 152) rotate(32)">
          <g class="peek"><g class="bob">
            <image href="watermark_assets/pochita.png" x="-95" y="-170" width="182" height="190"/>
          </g></g>
        </g>

        <!-- spinning chain ring -->
        <g class="ring">
          <circle cx="320" cy="300" r="246" fill="none" stroke="var(--ink)" stroke-width="24"/>
          <circle cx="320" cy="300" r="246" fill="none" stroke="#5c5c5c" stroke-width="8" stroke-dasharray="16 10"/>
          <g class="teeth"></g>
        </g>

        <!-- inside the saw: black, Makima's rings, Denji -->
        <circle cx="320" cy="300" r="238" fill="var(--ink)"/>
        <g clip-path="url(#inside)">
          <g fill="none" stroke="var(--blood)" stroke-width="3">
            <circle cx="320" cy="300" r="200"/>
            <circle cx="320" cy="300" r="160"/>
            <circle cx="320" cy="300" r="120"/>
          </g>
          <g class="denji">
            <image href="watermark_assets/denji.png" x="168" y="70" width="304" height="470"/>
          </g>
        </g>

        <!-- red brush stroke + drips -->
        <g class="slash">
          <path d="M58 352 L92 318 L170 306 L250 300 L360 290 L470 276 L560 262 L590 270 L572 290 L600 296
                   L548 326 L430 344 L320 356 L210 366 L120 376 L80 384 L96 366 Z"
                fill="var(--red)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
          <path class="drip" d="M180 362 h14 v40 a7 7 0 0 1 -14 0 z" style="transform-origin: 187px 362px"/>
          <path class="drip" d="M462 336 h11 v30 a5.5 5.5 0 0 1 -11 0 z" style="transform-origin: 467px 336px"/>
        </g>

        <!-- name -->
        <g class="name-out">
          <g class="name">
            <text class="word" x="325" y="362" text-anchor="middle" fill="var(--ink)">Raqueshi</text>
            <text class="word" x="318" y="355" text-anchor="middle" fill="var(--paper)"
                  stroke="var(--ink)" stroke-width="5" paint-order="stroke">Raqueshi</text>
            <g transform="translate(0 22)">
              <rect x="190" y="400" width="260" height="44" rx="4" fill="var(--ink)"/>
              <line x1="200" y1="420" x2="252" y2="420" stroke="var(--red)" stroke-width="3"/>
              <line x1="388" y1="420" x2="440" y2="420" stroke="var(--red)" stroke-width="3"/>
              <use href="#diamond" x="194" y="420"/>
              <use href="#diamond" x="446" y="420"/>
              <text x="320" y="432" text-anchor="middle" font-family="'Noto Serif JP', 'Hiragino Mincho ProN', serif"
                    font-weight="900" font-size="32" letter-spacing="12" fill="var(--red)">ラケシ</text>
            </g>
          </g>
        </g>

        <!-- pull cord -->
        <g class="cord">
          <line x1="320" y1="520" x2="320" y2="596" stroke="var(--ink)" stroke-width="7"/>
          <rect x="286" y="594" width="68" height="20" rx="10" fill="var(--red)" stroke="var(--ink)" stroke-width="5"/>
        </g>

        <!-- blood spatter -->
        <g class="spatter">
          <circle cx="78"  cy="180" r="14" style="transform-origin: 78px 180px"/>
          <circle cx="52"  cy="214" r="7"  style="transform-origin: 52px 214px"/>
          <circle cx="570" cy="440" r="16" style="transform-origin: 570px 440px"/>
          <circle cx="602" cy="408" r="8"  style="transform-origin: 602px 408px"/>
          <circle cx="590" cy="476" r="5"  style="transform-origin: 590px 476px"/>
          <circle cx="110" cy="520" r="9"  style="transform-origin: 110px 520px"/>
        </g>

      </g>
    </g>
  </g>
  </g>
</svg>
</template>

<div class="hint">Plays every 2.5s · Space = pause/resume loop · R = play once · F = fullscreen</div>

<script>
  const tpl = document.getElementById('mark');
  let looping = true;

  // whole watermark lasts ~1.5s, then green until the next play
  function play() {
    document.querySelector('svg')?.remove();
    const svg = tpl.content.firstElementChild.cloneNode(true);
    const teeth = svg.querySelector('.teeth');
    for (let i = 0; i < 32; i++) {
      const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      use.setAttribute('href', '#tooth');
      use.setAttribute('transform', `rotate(${i * 360 / 32} 320 300)`);
      teeth.appendChild(use);
    }
    document.body.prepend(svg);
  }

  document.fonts.load('116px "Most Wasted"').finally(() => {
    play();
    setInterval(() => looping && play(), 2500);
  });

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
    if (k === 'r') play();
    if (k === ' ') { looping = !looping; e.preventDefault(); }
  });
</script>
</body>
</html>
