  }

  /* ================= FIGURES (version 17) ================= */
  /* thin-line figures in the portfolio&#x27;s own colours, sitting behind the content of each section:
     sparkles (the ✦ from the ticker), orbit rings, registration marks, viewfinder brackets, film strips,
     mountain ridges (the palette came from the mountaineering slide), record grooves, waveforms and star maps.
     Each one is placed with --x / --y (position), --w (size), --r (turn); data-d makes it drift a little on scroll. */
  .fx { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  section.block &gt; .wrap, .part &gt; .wrap, .onmedia &gt; .wrap, .projects &gt; .wrap { position: relative; z-index: 1; }
  .strip, .drag-hint, .list-intro, .film-top { position: relative; z-index: 1; }
  .fig { position: absolute; left: var(--x); top: var(--y); width: var(--w); height: auto; overflow: visible; color: var(--c, var(--cream));
    opacity: var(--o, 0.35); transform: rotate(var(--r, 0deg)); translate: 0 var(--py, 0px); }
  .fig.spark { animation: twinkle var(--t, 3.6s) ease-in-out var(--dl, 0s) infinite; }
  @keyframes twinkle { 0%, 100% { scale: 1; opacity: var(--o, 0.6); } 50% { scale: 0.45; opacity: calc(var(--o, 0.6) * 0.4); } }
  .fig.turn { animation: turn var(--t, 60s) linear infinite; }
  @keyframes turn { to { rotate: 360deg; } }
  .fig.glow { filter: drop-shadow(0 0 6px currentColor); }
  /* a short piece of film stock */
  .fstrip { position: absolute; left: var(--x); top: var(--y); width: var(--w); height: 46px; opacity: var(--o, 0.22); transform: rotate(var(--r, 0deg)); translate: 0 var(--py, 0px);
    border-top: 1px solid var(--cream); border-bottom: 1px solid var(--cream);
    background:
      radial-gradient(circle, var(--cream) 0 1.6px, transparent 2.2px) 0 5px / 14px 8px repeat-x,
      radial-gradient(circle, var(--cream) 0 1.6px, transparent 2.2px) 0 calc(100% - 5px) / 14px 8px repeat-x,
      repeating-linear-gradient(90deg, transparent 0 60px, rgba(236,232,225,0.7) 60px 61px);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
  /* small timecode / coordinates labels */
  .fig-tag { position: absolute; left: var(--x); top: var(--y); font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c, var(--lavender)); opacity: var(--o, 0.45); white-space: nowrap; transform: rotate(var(--r, 0deg)); }
  /* big outlined chapter numbers behind the headings */
  .chapter-head[data-ghost] { position: relative; isolation: isolate; }
  .chapter-head[data-ghost]::before { content: attr(data-ghost); position: absolute; z-index: -1; left: -0.06em; top: 50%; transform: translateY(-62%);
    font-family: var(--display); font-weight: 700; font-size: clamp(110px, 15vw, 230px); line-height: 1; font-optical-sizing: none; font-variation-settings: &quot;opsz&quot; 11;
    color: transparent; -webkit-text-stroke: 1px rgba(138,150,166,0.38); pointer-events: none; }
  @media (max-width: 760px) {
    .fx .mob-hide { display: none; }
    .fig, .fstrip { opacity: calc(var(--o, 0.35) * 0.75); }
  }

  /* ===================== VERSION 31 =====================
     Version 22&#x27;s own look (navy, cream, orange, Bodoni titles, the film-camera feel), with the best ideas from the
     Pacific Rim versions 27–30 turned into film language instead of robots:
     - clear &quot;Chapter 02 / Film&quot; tags on every section (all four)
     - camera-viewfinder corner brackets around section titles (Gipsy Danger&#x27;s cockpit brackets)
     - a slowly turning camera aperture with live camera readouts and a running timecode on the opening screen
       (Gipsy Danger&#x27;s reactor centrepiece; Crimson Typhoon&#x27;s glow)
     - film-strip dividers with sprocket holes between parts (the hazard tape)
     - a reel-progress counter in the corner (the drift gauges)
     - readable subtitles instead of the small script, brighter body text, and offset block shadows on the posters (Cherno Alpha)
     - bigger, bolder section titles (Striker Eureka) */

  /* chapter tags */
  .ctag { display: inline-flex; align-items: center; gap: 10px; width: fit-content; padding: 7px 12px;
    border: 1px solid rgba(138,150,166,0.5); background: rgba(138,150,166,0.1);
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream); text-shadow: none; }
  .ctag i { font-style: normal; color: var(--orange); }
  .ctag::before { content: &quot;&quot;; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 8px var(--orange); animation: blink 1.2s steps(2) infinite; }
  .idx.ctag { padding-bottom: 7px; }
  .onmedia .mono.ctag { margin-bottom: 28px; }
  .why .ctag { margin-inline: auto; }
  .part .ctag { margin: 0 auto; }

  /* section titles: tag on its own line, framed by viewfinder corners, bigger and bolder */
  .chapter-head::after { content: &quot;&quot;; flex-basis: 100%; height: 0; order: 1; }
  .chapter-head &gt; * { order: 2; }
  .chapter-head &gt; .ctag { order: 0; }
  .chapter-head { padding: 16px 22px 22px; background:
      linear-gradient(rgba(236,232,225,0.55), rgba(236,232,225,0.55)) 0 0 / 22px 1.5px no-repeat,
      linear-gradient(rgba(236,232,225,0.55), rgba(236,232,225,0.55)) 0 0 / 1.5px 22px no-repeat,
      linear-gradient(rgba(236,232,225,0.55), rgba(236,232,225,0.55)) 100% 100% / 22px 1.5px no-repeat,
      linear-gradient(rgba(236,232,225,0.55), rgba(236,232,225,0.55)) 100% 100% / 1.5px 22px no-repeat; }
  .chapter-head h2 { font-weight: 700; font-size: clamp(56px, 8vw, 120px); }
  .edit-grid .chapter-head h2 { font-size: clamp(54px, 7vw, 100px); }
  .chapter-head h2 em, .part-title em { font-family: var(--mono); font-size: 0.19em; letter-spacing: 0.32em; text-transform: uppercase;
    margin: 1em 0 0 0.2em; text-shadow: 0 0 18px rgba(184,149,106,0.5); }
  .part-title em { font-size: 0.17em; }
  .part.projects-part .part-title em { margin-top: 1.2em; }

  /* easier to read */
  .copy p { color: #e4e9f1; }
  .onmedia-body { color: #c9d1e3; }
  .why p { color: #eceff5; }
  .proj p { color: #d9dfe9; }

  /* posters: offset block shadow */
  .poster img { border-radius: 2px; box-shadow: 7px 7px 0 -1px rgba(138,150,166,0.6), 0 24px 50px rgba(0,0,0,0.5); }

  /* a short accent bar where each section starts */
  section.block { border-top: 1px solid var(--hair); }
  section.block::after { content: &quot;&quot;; position: absolute; top: -1px; left: var(--g); width: 140px; height: 3px; background: linear-gradient(90deg, var(--cobalt), var(--orange)); }

  /* film-strip dividers */
  .filmstrip { position: relative; z-index: 2; height: 30px; background:
      radial-gradient(ellipse 4px 3.2px, rgba(236,232,225,0.8) 92%, transparent 100%) 0 6px / 20px 8px repeat-x,
      radial-gradient(ellipse 4px 3.2px, rgba(236,232,225,0.8) 92%, transparent 100%) 0 calc(100% - 6px) / 20px 8px repeat-x,
      linear-gradient(90deg, transparent, rgba(138,150,166,0.5), rgba(184,149,106,0.5), transparent) 0 50% / 100% 1px no-repeat, #000; }

  /* opening reel: a camera aperture, viewfinder and live readouts */
  .reel { background: radial-gradient(40% 50% at 50% 38%, rgba(184,149,106,0.12), transparent 70%), radial-gradient(70% 70% at 50% 40%, rgba(138,150,166,0.12), transparent 70%), #000; }
  .reel .outline { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none;
    font-family: var(--display); font-weight: 700; font-size: clamp(70px, 17vw, 280px); line-height: 1; letter-spacing: 0.04em;
    color: transparent; -webkit-text-stroke: 1px rgba(236,232,225,0.13); }
  .iris { position: absolute; left: 50%; top: 38%; width: min(34vw, 340px); aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none;
    filter: drop-shadow(0 0 40px rgba(184,149,106,0.25)); }
  .iris svg { width: 100%; height: 100%; overflow: visible; }
  .i-ring { fill: rgba(6,6,6,0.9); stroke: rgba(236,232,225,0.35); stroke-width: 1.5; }
  .i-ticks line { stroke: rgba(236,232,225,0.4); stroke-width: 1; }
  .i-blades { fill: rgba(138,150,166,0.28); stroke: rgba(236,232,225,0.55); stroke-width: 0.8; transform-origin: 100px 100px; animation: iris 40s linear infinite; }
  .i-glow { animation: breathe 5s ease-in-out infinite; transform-origin: 100px 100px; }
  @keyframes iris { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { transform: scale(0.82); opacity: 0.75; } }
  .vf { position: absolute; inset: clamp(70px, 9vw, 100px) var(--g) 30%; pointer-events: none; z-index: 2;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(236,232,225,0.75); background:
      linear-gradient(rgba(236,232,225,0.6), rgba(236,232,225,0.6)) 0 0 / 30px 1.5px no-repeat, linear-gradient(rgba(236,232,225,0.6), rgba(236,232,225,0.6)) 0 0 / 1.5px 30px no-repeat,
      linear-gradient(rgba(236,232,225,0.6), rgba(236,232,225,0.6)) 100% 0 / 30px 1.5px no-repeat, linear-gradient(rgba(236,232,225,0.6), rgba(236,232,225,0.6)) 100% 0 / 1.5px 30px no-repeat,
      linear-gradient(rgba(236,232,225,0.6), rgba(236,232,225,0.6)) 0 100% / 30px 1.5px no-repeat, linear-gradient(rgba(236,232,225,0.6), rgba(236,232,225,0.6)) 0 100% / 1.5px 30px no-repeat,
      linear-gradient(rgba(236,232,225,0.6), rgba(236,232,225,0.6)) 100% 100% / 30px 1.5px no-repeat, linear-gradient(rgba(236,232,225,0.6), rgba(236,232,225,0.6)) 100% 100% / 1.5px 30px no-repeat; }
  .vf span { position: absolute; padding: 12px 16px; }
  .vf .tl { left: 0; top: 0; } .vf .tr { right: 0; top: 0; } .vf .bl { left: 0; bottom: 0; } .vf .br { right: 0; bottom: 0; color: var(--cream); }
  @media (max-width: 700px) { .vf .tr, .vf .bl { display: none; } }

  /* reel progress counter */
  .reelcount { position: fixed; left: 14px; bottom: 14px; z-index: 40; min-width: 128px; padding: 8px 12px 9px; pointer-events: none;
    background: rgba(0,0,0,0.85); border: 1px solid var(--hair); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--lavender); }
  .reelcount b { display: block; margin-top: 4px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0; color: var(--cream); }
  .reelcount i { display: block; height: 2px; margin-top: 6px; background: linear-gradient(90deg, var(--cobalt), var(--orange) var(--s, 0%), rgba(236,232,225,0.12) var(--s, 0%)); }
  @media (max-width: 700px) { .reelcount { transform: scale(0.85); transform-origin: 0 100%; left: 8px; bottom: 8px; } }
  @media (prefers-reduced-motion: reduce) { .i-blades, .i-glow, .ctag::before { animation: none; } }
  /* VERSION 45 — the strip loops forever and follows the arrow keys (see the script). VERSION 41 — four whole posters fill the scroller (three on tablets, two on phones) */
  .strip { --pgap: clamp(20px, 3vw, 36px); gap: var(--pgap); scroll-padding-inline: var(--g); }
  .poster { flex: 0 0 calc((100% - 3 * var(--pgap)) / 4); scroll-snap-align: start; }
  @media (max-width: 900px) { .poster { flex-basis: calc((100% - 2 * var(--pgap)) / 3); } }
  .poster figcaption b { font-size: clamp(14px, 1.3vw, 18px); }
  @media (max-width: 560px) { .poster { flex-basis: calc((100% - var(--pgap)) / 2); } }
  /* TikTok link in the editing chapter */
  .tt-link { color: var(--peach); border-bottom: 1px solid rgba(205,177,140,0.5); }
  .tt-link:hover { color: var(--cream); border-color: var(--cream); }
  .tiktok { display: inline-flex; align-items: center; gap: 14px; margin-top: 22px; padding: 12px 18px 12px 14px; border: 1px solid rgba(138,150,166,0.5);
    background: rgba(138,150,166,0.1); box-shadow: 6px 6px 0 -1px rgba(184,149,106,0.45); transition: transform .3s ease, box-shadow .3s ease, background .3s ease; }
  .tiktok svg { width: 30px; height: 30px; fill: var(--cream); filter: drop-shadow(-1.5px -1px 0 #25f4ee) drop-shadow(1.5px 1px 0 #fe2c55); }
  .tiktok span { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--cream); }
  .tiktok span b { display: block; margin-top: 3px; font-family: var(--sans); font-weight: 500; font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--muted); }
  .tiktok i { font-style: normal; color: var(--orange); font-size: 18px; }
  .tiktok:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 -1px rgba(184,149,106,0.6); background: rgba(138,150,166,0.18); }
  /* VERSION 42 — an iconic object from the chosen film slides in from the left under its poster */
  .film-prop { margin: clamp(30px, 4vw, 54px) 0 0; overflow: visible; }
  .film-prop img { display: block; max-width: min(100%, 380px); max-height: 300px; width: auto; height: auto;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.55)) drop-shadow(0 0 24px rgba(138,150,166,0.2)); }
  .film-prop span { display: block; margin-top: 16px; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .film-prop span i { font-style: normal; color: var(--orange); }
  .film-prop.in { animation: prop-in 1.1s cubic-bezier(.2,.8,.2,1) .25s both; }
  .film-prop.in img { animation: prop-float 5s ease-in-out 1.4s infinite; }
  @keyframes prop-in { from { opacity: 0; transform: translateX(-120%) rotate(-10deg); } 70% { opacity: 1; } to { opacity: 1; transform: none; } }
  @keyframes prop-float { 50% { transform: translateY(-6px) rotate(-1.5deg); } }
  @media (max-width: 760px) { .film-prop { display: none; } }
  @media (prefers-reduced-motion: reduce) { .film-prop.in, .film-prop.in img { animation: none; } }

  /* VERSION 73 — links to preliminary project 66 (storyboard as a grid grouped by scene).
     VERSION 72 — faster video start (see the last script at the end of the page).
     VERSION 71 — the three projects are laid out in rows like a festival programme (the layout from the Season 2
     Edgerunners version, in this design&#x27;s own colours and fonts): the video and its text side by side, the middle
     one mirrored, a cobalt rule over each title. The big button to the preliminary project is now two buttons:
     the preliminary project and the new final project page. */
  @media (min-width: 961px) {
    .proj-grid { grid-template-columns: minmax(0, 1fr); gap: 64px; max-width: 1080px; margin: 0 auto; }
    .proj { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 48px; align-items: center; }
    .proj:nth-child(2) { grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr); }
    .proj:nth-child(2) .proj-frame { order: 2; }
    .proj figcaption { padding-top: 18px; border-top: 2px solid var(--cobalt); }
    .proj h3 { font-weight: 700; font-size: clamp(36px, 3.6vw, 56px); line-height: 0.95; font-variation-settings: &quot;opsz&quot; 11; }
    .proj p { font-size: 17px; }
  }
  .proj:hover .proj-frame { box-shadow: 0 0 0 1px rgba(138,150,166,0.5), 10px 10px 0 var(--orange), 0 30px 60px rgba(0,0,0,0.55); }
  .cta-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(24px, 3vw, 40px); margin-top: clamp(56px, 7vw, 96px); }
  .cta-pair .prelim-cta { margin-top: 0; padding: clamp(24px, 3vw, 40px) clamp(22px, 3vw, 40px); }
  .cta-pair .pc-title { font-size: clamp(36px, 4.6vw, 72px); }
  .cta-pair .pc-title em { margin-left: 2.2em; }
  .cta-pair .pc-go { width: clamp(50px, 5vw, 72px); font-size: clamp(22px, 2.4vw, 30px); }
  .final-cta { background:
      radial-gradient(ellipse 45% 90% at 85% 110%, rgba(0,0,0,0), transparent 70%),
      radial-gradient(ellipse 60% 100% at 15% -10%, rgba(0,0,0,0), transparent 70%),
      linear-gradient(135deg, var(--navy), var(--slate));
    box-shadow: 0 0 0 1px rgba(184,149,106,0.45), 16px 16px 0 -2px var(--cobalt), 0 30px 80px rgba(0,0,0,0.5); }
  .final-cta:hover, .final-cta:focus-visible { box-shadow: 0 0 0 1px var(--orange), 22px 22px 0 -2px var(--cobalt), 0 0 60px rgba(184,149,106,0.3), 0 40px 90px rgba(0,0,0,0.55); }
  .final-cta .pc-go { background: var(--cobalt); color: var(--cream); box-shadow: 0 0 30px rgba(138,150,166,0.5); }
  #final { scroll-margin-top: 90px; }
  @media (max-width: 860px) { .cta-pair { grid-template-columns: minmax(0, 1fr); } }

  /* VERSION 74 — Donnie Darko added to the films; the strip has a copy of the posters on each side so it can be
     flicked as fast as you like without hitting an end (see the script). Copies of the open film are hidden. */
  .poster.clone.away { display: none; }
  /* VERSION 76 — Donnie Darko stays in its place in the strip after it has been opened; its prop is Frank&#x27;s mask */
  .strip { overscroll-behavior-x: contain; }

  /* VERSION 75 — smoother film strip: no scrollbar under it, no snapping (snapping fought fast trackpad scrolls,
     most of all in Safari), the posters ignore the mouse while the strip is moving (their hover lift kept firing
     as they slid under the pointer), and all poster pictures are loaded and decoded before you reach the films,
     so none has to be unpacked in the middle of a scroll. */
  .strip { scroll-snap-type: none !important; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .strip::-webkit-scrollbar { display: none; height: 0; }
  .poster { scroll-snap-align: none; }
  .strip.moving .poster { pointer-events: none; }
  .strip.moving .poster, .strip.moving .poster img { transition: none; }
  .drag-hint { margin-top: 6px; }

  /* VERSION 77 — (3) one left edge: Film and Music no longer sit centred, so every chapter title and paragraph
     starts at the same line as Intro and Editing. (4) Why Media Studies gets a chapter title like the others,
     left-aligned text and a pull quote. (5) every project has a ↓ button under its sentence that opens a box
     for more writing (fill in the empty .more-box in the HTML). Footer: email removed. */
  .film-text { justify-self: start; }
  .center-top { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: clamp(20px, 2.5vw, 32px); }
  .center-top .copy p { max-width: 640px; }
  .list-intro, .list-hint { text-align: left; }

  section.block.why { padding-top: clamp(36px, 4vw, 56px); text-align: left; }
  .why .ctag { margin-inline: 0; }
  .why-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(32px, 6vw, 96px); align-items: end; }
  .why-grid .chapter-head { margin-bottom: clamp(20px, 2.5vw, 32px); }
  .why .copy p { max-width: 560px; margin: 0; font-size: 17px; }
  .why-quote { margin: 0 0 6px; padding-left: clamp(20px, 2.5vw, 32px); border-left: 2px solid var(--orange); }
  .why .why-quote p { max-width: 460px; margin: 0; font-family: var(--display); font-style: italic; font-size: clamp(24px, 2.6vw, 36px); line-height: 1.2; color: var(--cream); }
  @media (max-width: 960px) { .why-grid { grid-template-columns: minmax(0, 1fr); align-items: start; } }

  .more-btn { display: grid; place-items: center; width: 40px; height: 40px; margin-top: 18px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(138,150,166,0.6); background: rgba(138,150,166,0.1); color: var(--cream); font-size: 18px; cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease; }
  .more-btn span { display: block; transition: transform 0.35s cubic-bezier(.2,.8,.2,1); }
  .more-btn:hover, .more-btn:focus-visible { background: var(--cobalt); border-color: var(--cobalt); }
  .more-btn[aria-expanded=&quot;true&quot;] span { transform: rotate(180deg); }
  .proj-more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.45s cubic-bezier(.2,.8,.2,1); }
  .proj-more.open { grid-template-rows: 1fr; }
  .proj-more-in { overflow: hidden; min-height: 0; }
  .more-box { margin-top: 16px; min-height: 140px; padding: 18px 20px; border: 1px dashed rgba(201,208,222,0.35); border-radius: 6px;
    background: rgba(255,255,255,0.03); }
  .more-box p { font-size: 15px; }
  .more-box p + p { margin-top: 0.8em; }
  @media (prefers-reduced-motion: reduce) { .proj-more, .more-btn span { transition: none; } }

  footer .meta-row { grid-template-columns: 1fr 1fr; }
  footer .meta-row &gt; :nth-child(2) { display: block; text-align: right; }

  /* VERSION 78 — the button under each project is a simple chevron (a &quot;&lt;&quot; turned to point down), centred under
     the text; it flips 180° when the space is open. The space has no box: just room for the text you add. */
  .more-btn { display: block; width: 44px; height: 32px; margin: 14px auto 0; border: 0; border-radius: 0; background: none; color: var(--cream); opacity: 0.75; }
  .more-btn:hover, .more-btn:focus-visible { background: none; opacity: 1; }
  .more-btn svg { display: block; width: 30px; height: 30px; margin: 0 auto; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1); }
  .more-btn[aria-expanded=&quot;true&quot;] svg { transform: rotate(180deg); }
  .more-box { margin-top: 10px; min-height: 140px; padding: 0; border: 0; border-radius: 0; background: none; }
  @media (prefers-reduced-motion: reduce) { .more-btn svg { transition: none; } }

  /* ===================== VERSION 84 — a calmer, more mature look =====================
     Fewer ornaments, a muted palette (charcoal, warm white, a single brass accent), lighter titles,
     no glows or offset shadows, and real photographs of media equipment as part of the layout. */
  :root {
    --ink: #000000;
    --navy: #000000;
    --slate: #0a0a0a;
    --steel: #4a525c;
    --cobalt: #8a96a6;
    --ice: #e9e6e0;
    --cream: #ece8e1;
    --orange: #b8956a;
    --peach: #cdb18c;
    --lavender: #9aa2ac;
    --muted: #8b9098;
    --hair: rgba(236, 232, 225, 0.10);
    --script: &#x27;Bodoni Moda&#x27;, Georgia, serif;
  }
  body { background: var(--ink); }
  body::after { opacity: 0.035; }

  /* remove the decorative layer: drifting figures, sparkles, film-strip scraps, ghost numbers, glows */
  .fx, .fstrip, .fig, .fig-tag { display: none !important; }
  .chapter-head[data-ghost]::before { display: none; }
  * { text-shadow: none !important; }
  .ctag::before, .rec i { animation: none !important; box-shadow: none !important; background: var(--orange); }

  /* labels: quiet, small, no boxes */
  .ctag { padding: 0; border: 0; background: none; gap: 12px; color: var(--muted); letter-spacing: 0.22em; font-size: 11px; }
  .ctag::before { width: 28px; height: 1px; border-radius: 0; }
  .ctag i { color: var(--muted); }

  /* titles: lighter weight, tighter, no corner brackets */
  h1, h2 { font-weight: 400 !important; letter-spacing: -0.01em; }
  h2 em, h1 em, .part-title em { font-family: var(--mono) !important; font-style: normal !important; font-size: 11px !important;
    letter-spacing: 0.28em !important; text-transform: uppercase; color: var(--orange) !important; }
  .chapter-head { background: none !important; padding: 0 !important; }

  /* section edges: nothing but space */
  section.block::after { display: none; }
  .plate + section.block, .plate + section.part, .plate + .chapter { border-top: 0 !important; }
  .part.projects-part::before, .reel::after { display: none !important; }
  .plate figcaption { bottom: 6%; }
  /* buttons and chips: square-cornered, hairline, no fills */
  .nav .links a, .part-toc a, .chip, .chips span, .pill, .subjects span, .btn { border-radius: 0 !important; }
  .part-toc a { background: none !important; }
  body { letter-spacing: 0.005em; }
  p { color: rgba(236,232,225,0.78); }
  .filmstrip { height: 1px; background: var(--hair); }

  /* cards and buttons: flat, thin borders, soft shadows only */
  .poster img, .tiktok, .proj-media, .case, .card, .cut, .eval &gt; div, .sound &gt; div { box-shadow: 0 18px 40px rgba(0,0,0,0.35) !important; }
  .tiktok { border-color: var(--hair); background: rgba(255,255,255,0.03); }
  .tiktok:hover { transform: none; background: rgba(255,255,255,0.06); }

  /* film frames: wide 2.39:1 cinema crop, dissolving into the black page at the bottom */
  .plate { position: relative; margin: 0; overflow: hidden; background: #000; }
  .plate img { display: block; width: 100%; height: 100%; object-fit: cover; filter: saturate(0.88) contrast(1.06);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 34%, rgba(0,0,0,0.6) 58%, rgba(0,0,0,0.18) 80%, transparent 96%);
            mask-image: linear-gradient(180deg, #000 0%, #000 34%, rgba(0,0,0,0.6) 58%, rgba(0,0,0,0.18) 80%, transparent 96%); }
  .plate::after { content: &quot;&quot;; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,0.5), transparent 22%); }
  .plate figcaption { position: absolute; z-index: 1; left: var(--g); right: var(--g); bottom: 14px; display: flex; justify-content: space-between; gap: 20px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(236,232,225,0.7); }
  .plate figcaption span:last-child { color: rgba(236,232,225,0.35); text-align: right; }
  .plate.band { height: auto; aspect-ratio: 2.39 / 1; max-height: 86vh; }
  @media (max-width: 700px) { .plate figcaption span:last-child { display: none; } }

  /* top bar */
  .nav .links a.to-projects { background: none !important; color: var(--cream) !important; border-color: var(--hair) !important; box-shadow: none !important; }
  .nav .links a.to-projects:hover, .nav .links a.to-projects.on { border-color: var(--orange) !important; color: var(--orange) !important; }

  .hero-title .script { font-family: var(--mono); font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--orange); margin: 0 0 22px 0.3em; }
  .hero-title .tracked { letter-spacing: 0.32em; font-size: 12px; color: var(--muted); }

  /* VERSION 85 — film posters stand level (no tilt, no staggered heights); hovering lifts one straight up */
  .strip .poster { transform: none; }
  .strip .poster:hover, .strip .poster:focus-within { transform: translateY(-10px); }

  /* intro photos: a straight, gridded set instead of a tilted collage with paint and a scribble */
  .intro img { box-shadow: 0 18px 40px rgba(0,0,0,0.35) !important; outline: 0 !important; border-radius: 0 !important; }
  .stack .brush, .stack .scribble { display: none !important; }
  .stack .s1 { transform: none; left: 0; top: 0; width: 56%; height: 62%; }
  .stack .s2 { transform: none; right: 0; top: 0; width: 40%; height: 34%; }
  .stack .s3 { transform: none; right: 0; bottom: 0; width: 40%; height: 54%; }
  .stack figcaption { color: var(--muted); letter-spacing: 0.18em; font-size: 10px; }

  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;mono ctag rv&quot;&gt;Prologue &lt;i&gt;/&lt;/i&gt; On media&lt;/div&gt;
    &lt;p class=&quot;statement&quot; id=&quot;statement&quot;&gt;Every &lt;span class=&quot;key&quot;&gt;cut,&lt;/span&gt; every &lt;span class=&quot;key&quot;&gt;sound,&lt;/span&gt; every &lt;span class=&quot;key&quot;&gt;frame&lt;/span&gt; is a choice, and every choice decides what we &lt;em class=&quot;key&quot;&gt;feel.&lt;/em&gt;&lt;/p&gt;
    &lt;div class=&quot;onmedia-body&quot;&gt;
      &lt;p class=&quot;rv&quot;&gt;Malcolm X called the media the most powerful entity on earth, and I think he was right. It doesn&#x27;t only show us the world; it decides which parts of it we see, in what order, and to what music.&lt;/p&gt;
      &lt;p class=&quot;rv&quot;&gt;One edit can turn a stranger into a hero or a villain. One song can turn a sad scene into an unsettling one. Most of the time we never notice it happening, and that is exactly what makes it so powerful.&lt;/p&gt;
    &lt;/div&gt;
    &lt;p class=&quot;onmedia-close rv&quot;&gt;&lt;small&gt;Why I&#x27;m here&lt;/small&gt;I want to learn to see the choices behind everything we watch, and then learn to make them myself.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

    &lt;div class=&quot;chapter-head rv&quot; data-ghost=&quot;02&quot;&gt;
      &lt;span class=&quot;idx ctag&quot;&gt;Chapter 02 &lt;i&gt;/&lt;/i&gt; Film&lt;/span&gt;
      &lt;h2&gt;Film&lt;em&gt;&amp;amp; cinema&lt;/em&gt;&lt;/h2&gt;
    &lt;/div&gt;
    &lt;div class=&quot;copy rv&quot;&gt;
      &lt;p&gt;My interest in film and cinematography has been present from a young age, as it has been an important part of my family background. Being exposed to the industry through my family has given me an appreciation for the creativity, planning and collaboration that go into producing content, and has encouraged me to explore filmmaking myself.&lt;/p&gt;
    &lt;/div&gt;
    &lt;/div&gt;

  &lt;p class=&quot;wrap list-intro rv&quot;&gt;Some of my favourite films:&lt;/p&gt;
  &lt;p class=&quot;wrap mono rv list-hint&quot; style=&quot;margin-top:8px&quot;&gt;Click a poster to open it&lt;/p&gt;
  &lt;div class=&quot;strip rv&quot; id=&quot;film-strip&quot; aria-label=&quot;Film posters — scroll sideways&quot;&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_pulp_fiction.jpg&quot; style=&quot;--r:-4deg&quot; data-yt=&quot;o5qXCzknxn8&quot; data-clip=&quot;The twist contest at Jack Rabbit Slim&#x27;s&quot; data-why=&quot;The camera holds back and lets Mia and Vincent dance to Chuck Berry&#x27;s ‘You Never Can Tell’ in long, unhurried shots: a strange, cool pause in the middle of a violent film. The song is diegetic, chosen in the world of the film, so the characters seem to control the mood. It also works as what Barthes calls an enigma code: the audience keeps asking whether Vincent will cross a line with his boss’s wife, and the non-linear narrative delays the answer.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-1&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@4c86924/media_photos_hq/pulp_fiction.jpg&quot; alt=&quot;Pulp Fiction poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 01&lt;b&gt;Pulp Fiction&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-1&quot;&gt;&lt;span class=&quot;made&quot;&gt;1994 · Quentin Tarantino&lt;/span&gt;&lt;p&gt;Two hitmen, a boxer, a gangster&#x27;s wife and a pair of diner robbers cross paths in Los Angeles, in interlocking crime stories told out of order.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_the_matrix.jpg&quot; style=&quot;--r:3deg; --y:14px&quot; data-yt=&quot;73ytL_HAwt8&quot; data-clip=&quot;Dodging bullets on the rooftop&quot; data-why=&quot;Bullet time: a ring of still cameras around Neo freezes the moment while the view keeps moving, showing that he is starting to bend the rules of the Matrix. Slow motion and a circling camera turn a dodge into an iconic image of the hero discovering his power, a key step in what Propp would call the hero’s journey. It also shows Neale’s idea of genre as repetition and difference: a familiar action set piece, made new by a technique audiences had never seen.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-2&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@373b0ba/media_photos_hq/the_matrix.jpg&quot; alt=&quot;The Matrix poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 02&lt;b&gt;The Matrix&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-2&quot;&gt;&lt;span class=&quot;made&quot;&gt;1999 · The Wachowskis&lt;/span&gt;&lt;p&gt;Hacker Neo discovers the world is a simulation built by machines to enslave humanity, and joins Morpheus&#x27;s rebellion to fight back.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_perks.jpg&quot; style=&quot;--r:-2deg&quot; data-yt=&quot;kMalrBgdRvI&quot; data-clip=&quot;The tunnel&quot; data-why=&quot;Wind, flashing tunnel lights and David Bowie’s ‘Heroes’ turn a short drive into a feeling of total freedom. The song plays on the radio inside the film, but it anchors the meaning of the image (Barthes): Sam standing in the back of the truck with her arms out becomes a symbol of freedom. The mise-en-scène of open space, wind and light connotes escape from Charlie’s trauma.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-3&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@373b0ba/media_photos_hq/perks.jpg&quot; alt=&quot;The Perks of Being a Wallflower poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 03&lt;b&gt;The Perks of Being a Wallflower&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-3&quot;&gt;&lt;span class=&quot;made&quot;&gt;2012 · Stephen Chbosky&lt;/span&gt;&lt;p&gt;Shy, troubled freshman Charlie is taken in by two free-spirited seniors, who show him friendship, first love and great music, while he faces a trauma he has buried.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_real_steel.jpg&quot; style=&quot;--r:4deg; --y:10px&quot; data-yt=&quot;Vl9xbSB_52M&quot; data-clip=&quot;Shadow boxing in the final round&quot; data-why=&quot;Cutting between Charlie shadow-boxing outside the ring and Atom copying every move turns a robot fight into a story about a father and his son. This is parallel editing (cross-cutting) between two actions that mirror each other. It resolves the film’s binary opposition (Lévi-Strauss) between human and machine: the robot only wins because a human is moving with it.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-4&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@4c86924/media_photos_hq/real_steel.jpg&quot; alt=&quot;Real Steel poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 04&lt;b&gt;Real Steel&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-4&quot;&gt;&lt;span class=&quot;made&quot;&gt;2011 · Shawn Levy&lt;/span&gt;&lt;p&gt;In a future where robots have replaced human boxers, a washed-up fighter and his estranged son turn an old scrapyard robot into an unlikely champion contender.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_into_the_wild.jpg&quot; style=&quot;--r:-3deg&quot; data-yt=&quot;5UClGWfT1vY&quot; data-clip=&quot;The ending in the bus&quot; data-why=&quot;Chris finally understands that happiness is only real when shared. Close-ups of his face and the empty sky above him make the ending feel peaceful and devastating at the same time. An insert shot of his handwritten note makes the theme explicit, and the open framing contrasts his isolation with the endless landscape. Using Hall’s reception theory, the preferred reading admires his freedom, while an oppositional reading sees a reckless young man who ignored the people who loved him.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-5&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/into_the_wild.jpg&quot; alt=&quot;Into the Wild poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 05&lt;b&gt;Into the Wild&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-5&quot;&gt;&lt;span class=&quot;made&quot;&gt;2007 · Sean Penn&lt;/span&gt;&lt;p&gt;The true story of Christopher McCandless, who gives away his savings after graduating and hitchhikes across America to live alone in the Alaskan wilderness.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@be3e9a0/media_photos_hq/scene_limitless.jpg&quot; style=&quot;--r:2deg; --y:16px&quot; data-yt=&quot;99wI4z9U1aM&quot; data-clip=&quot;The first NZT pill&quot; data-why=&quot;The colour grade flips from cold, washed-out blue to sharp, warm gold the moment the pill kicks in, so we see Eddie’s mind change before he says a word. Colour grading here is media language: cold blue connotes failure and stagnation, warm gold connotes clarity and success (Barthes’ connotation). In Todorov’s terms, the pill is the disruption that sets the whole narrative moving.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-6&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@4c86924/media_photos_hq/limitless.jpg&quot; alt=&quot;Limitless poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 06&lt;b&gt;Limitless&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-6&quot;&gt;&lt;span class=&quot;made&quot;&gt;2011 · Neil Burger&lt;/span&gt;&lt;p&gt;A struggling writer takes a mysterious pill that unlocks his brain&#x27;s full potential, turning him into a genius overnight — until the side effects and dangerous people catch up with him.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_rush_hour.jpg&quot; style=&quot;--r:-4deg&quot; data-yt=&quot;0Rl9Cxc7uZA&quot; data-clip=&quot;“Do you understand the words…?”&quot; data-why=&quot;The joke is all contrast: Chris Tucker’s fast, loud delivery against Jackie Chan’s silence and blank stare. The buddy-cop genre depends on a binary opposition between two partners who could not be more different, here in culture, style and personality. A steady two-shot keeps both faces in frame, so the audience sees the contrast at the same moment the characters do.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-7&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@ef922cb/media_photos_hq/rush_hour.jpg&quot; alt=&quot;Rush Hour poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 07&lt;b&gt;Rush Hour&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-7&quot;&gt;&lt;span class=&quot;made&quot;&gt;1998 · Brett Ratner&lt;/span&gt;&lt;p&gt;A by-the-book Hong Kong detective and a loudmouthed LAPD cop are forced to team up to rescue a Chinese diplomat&#x27;s kidnapped daughter in Los Angeles.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_hail_mary.jpg&quot; style=&quot;--r:3deg; --y:14px&quot; data-yt=&quot;67-NVFrxQDA&quot; data-clip=&quot;Meeting Rocky&quot; data-why=&quot;First contact told almost without words: Rocky speaks in musical chords, so the sound design does the talking. Non-verbal communication and sound design build the relationship, so a language barrier becomes a source of warmth rather than threat. It subverts the sci-fi convention of the hostile alien, another example of genre as repetition and difference (Neale).&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-8&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@4c86924/media_photos_hq/hail_mary.jpg&quot; alt=&quot;Project Hail Mary poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 08&lt;b&gt;Project Hail Mary&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-8&quot;&gt;&lt;span class=&quot;made&quot;&gt;2026 · Phil Lord &amp;amp; Christopher Miller&lt;/span&gt;&lt;p&gt;A science teacher wakes up alone on a spaceship light-years from Earth with no memory, and must stop a microbe that is dimming the Sun — helped by an unlikely alien friend.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_500_days.jpg&quot; style=&quot;--r:-2deg&quot; data-yt=&quot;-fL94BTrFhs&quot; data-clip=&quot;Expectations vs. reality&quot; data-why=&quot;A split screen plays what Tom hopes will happen next to what actually happens, so we watch his hope and the truth side by side. The split screen is a self-conscious use of media language that shows expectation and reality at once. Together with the non-linear structure and the narrator warning that this is not a love story, it subverts the conventions of the romantic comedy.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-9&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@373b0ba/media_photos_hq/500_days_of_summer.jpg&quot; alt=&quot;(500) Days of Summer poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 09&lt;b&gt;(500) Days of Summer&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-9&quot;&gt;&lt;span class=&quot;made&quot;&gt;2009 · Marc Webb&lt;/span&gt;&lt;p&gt;Greeting-card writer Tom falls for his coworker Summer, who doesn&#x27;t believe in love. Jumping back and forth through their 500 days, the film shows how it all fell apart.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_fight_club.jpg&quot; style=&quot;--r:4deg; --y:10px&quot; data-yt=&quot;dC1yHLp9bWA&quot; data-clip=&quot;The first rule of Fight Club&quot; data-why=&quot;One bare bulb, a sickly green grade and Tyler slowly circling the men: lighting and blocking turn a bar basement into a cult. Low-key lighting and a desaturated grade create a dark, dangerous mise-en-scène, and Tyler’s movement around the room makes him the centre of power. It is also a representation of masculinity in crisis: men who feel powerless finding control through violence.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-10&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@4c86924/media_photos_hq/fight_club.jpg&quot; alt=&quot;Fight Club poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 10&lt;b&gt;Fight Club&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-10&quot;&gt;&lt;span class=&quot;made&quot;&gt;1999 · David Fincher&lt;/span&gt;&lt;p&gt;An insomniac office worker meets reckless soap salesman Tyler Durden, and together they start an underground fight club that spirals into something far more dangerous.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_the_martian.jpg&quot; style=&quot;--r:-3deg&quot; data-yt=&quot;DKd6-ugozkA&quot; data-clip=&quot;Growing potatoes on Mars&quot; data-why=&quot;Mark talks straight into his video-log camera, so the audience becomes the person he confides in, and his humour hides how alone he really is. The video logs are a form of direct address that stays inside the story, creating a personal bond with the audience. Humour subverts the survival genre’s usual despair, and the enigma of whether he will survive keeps the narrative moving.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-11&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@4c86924/media_photos_hq/the_martian.jpg&quot; alt=&quot;The Martian poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 11&lt;b&gt;The Martian&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-11&quot;&gt;&lt;span class=&quot;made&quot;&gt;2015 · Ridley Scott&lt;/span&gt;&lt;p&gt;Left behind on Mars after his crew presumes him dead, astronaut Mark Watney uses science and humour to survive alone while NASA races to bring him home.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_taxi.jpg&quot; style=&quot;--r:2deg; --y:16px&quot; data-yt=&quot;a-eQJEhQz2M&quot; data-clip=&quot;The opening ride&quot; data-why=&quot;From the first scene, low cameras close to the road and fast cutting make speed feel physical, and Marseille’s streets become a racetrack. Fast-paced editing, low-angle tracking shots and the roar of the engine in the sound mix establish the action-comedy genre within seconds. The real streets of Marseille become part of the mise-en-scène and give the film a strong sense of place.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-12&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@4c86924/media_photos_hq/taxi.jpg&quot; alt=&quot;Taxi poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 12&lt;b&gt;Taxi&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-12&quot;&gt;&lt;span class=&quot;made&quot;&gt;1998 · Gérard Pirès&lt;/span&gt;&lt;p&gt;Daniel, a speed-obsessed Marseille taxi driver, gets caught by a hopeless detective who can&#x27;t drive — so the two team up to chase down a gang of German bank robbers.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_pacific_rim.jpg&quot; style=&quot;--r:-4deg&quot; data-yt=&quot;fRKviUgMP4o&quot; data-clip=&quot;Gipsy Danger vs Otachi&quot; data-why=&quot;Neon-lit rain, slow, heavy movement and Ramin Djawadi’s theme give giant robots real weight and scale. Low-angle shots make the Jaegers dominate the frame, and slow motion gives every movement mass. The non-diegetic score acts as a leitmotif for the heroes, building excitement every time the theme returns.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-13&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@373b0ba/media_photos_hq/pacific_rim.jpg&quot; alt=&quot;Pacific Rim poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 13&lt;b&gt;Pacific Rim&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-13&quot;&gt;&lt;span class=&quot;made&quot;&gt;2013 · Guillermo del Toro&lt;/span&gt;&lt;p&gt;When giant monsters called Kaiju rise from a rift in the Pacific Ocean, humanity fights back with giant robots called Jaegers, each steered by two mind-linked pilots.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_maze_runner.jpg&quot; style=&quot;--r:3deg; --y:14px&quot; data-yt=&quot;QlkWsBL2nsM&quot; data-clip=&quot;Thomas runs into the Maze&quot; data-why=&quot;The camera stays at Thomas’s height as the huge stone walls grind shut, so we feel how small and trapped the boys are. The diegetic sound of grinding stone and the low camera create tension, while the closing walls set up the film’s central enigma code (Barthes): what lies beyond the maze, and who built it?&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-14&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@be3e9a0/media_photos_hq/maze_runner.jpg&quot; alt=&quot;The Maze Runner poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 14&lt;b&gt;The Maze Runner&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-14&quot;&gt;&lt;span class=&quot;made&quot;&gt;2014 · Wes Ball&lt;/span&gt;&lt;p&gt;Thomas wakes up with no memory in a glade surrounded by an enormous, ever-shifting maze, and must work with the other trapped teenagers to find a way out.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_wolf.jpg&quot; style=&quot;--r:-2deg&quot; data-yt=&quot;XErYzV4X_OQ&quot; data-clip=&quot;“Sell me this pen”&quot; data-why=&quot;One simple pen at a diner table: Brad’s answer, create a need and then supply it, explains the whole film’s world of persuasion. The scene is a simple setup that explains the whole narrative of persuasion. Through Hall’s reception theory, some audiences take a preferred reading that finds Jordan’s lifestyle exciting, while others read it oppositionally as a critique of greed and excess.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-15&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@730b83f/media_photos_hq/wolf_of_wall_street.jpg&quot; alt=&quot;The Wolf of Wall Street poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 15&lt;b&gt;The Wolf of Wall Street&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-15&quot;&gt;&lt;span class=&quot;made&quot;&gt;2013 · Martin Scorsese&lt;/span&gt;&lt;p&gt;Stockbroker Jordan Belfort gets rich fast by cheating his clients, and his life of money, drugs and excess spirals out of control until the FBI closes in.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_inception.jpg&quot; style=&quot;--r:4deg; --y:10px&quot; data-yt=&quot;X-KDt-G1pJ0&quot; data-clip=&quot;The rotating hallway fight&quot; data-why=&quot;The corridor was a real spinning set, so when gravity turns sideways the actors are really falling, and the dream feels physical rather than computer-made. Practical effects like this are an industry choice: real stunts make the audience believe in the world. Cross-cutting between dream levels, including a van falling in slow motion above, builds tension across several timelines at once.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-16&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@4c86924/media_photos_hq/inception.jpg&quot; alt=&quot;Inception poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 16&lt;b&gt;Inception&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-16&quot;&gt;&lt;span class=&quot;made&quot;&gt;2010 · Christopher Nolan&lt;/span&gt;&lt;p&gt;Dom Cobb steals secrets from people&#x27;s dreams, and is offered one last job: to plant an idea in someone&#x27;s mind instead of stealing one.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_intouchables.jpg&quot; style=&quot;--r:-3deg&quot; data-yt=&quot;Gd9wSNRcbco&quot; data-clip=&quot;Driss dances at the birthday party&quot; data-why=&quot;Earth, Wind &amp;amp; Fire’s ‘Boogie Wonderland’ bursts into a classical-music birthday party: the music shows two different worlds meeting. The music sets up a binary opposition (Lévi-Strauss) between classical and funk, wealth and the working-class suburbs, and the scene shows the two sides coming together. It is also a positive representation of a friendship across class and race.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-17&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/intouchables.jpg&quot; alt=&quot;1+1 (The Intouchables) poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 17&lt;b&gt;1+1 (The Intouchables)&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-17&quot;&gt;&lt;span class=&quot;made&quot;&gt;2011 · Olivier Nakache &amp;amp; Éric Toledano&lt;/span&gt;&lt;p&gt;A rich aristocrat, paralysed after a paragliding accident, hires a young man from the Paris suburbs as his carer, and the two become unlikely friends.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_bullet_train.jpg&quot; style=&quot;--r:2deg; --y:16px&quot; data-yt=&quot;0mNHQipuwl8&quot; data-clip=&quot;The quiet car fight&quot; data-why=&quot;A fight in a carriage where nobody may make a sound turns silence into the joke: whispered threats, muffled punches and perfect comedy timing. Diegetic sound is almost taken away, so every small noise becomes a punchline. The confined space of the carriage shapes the framing and choreography, and blends the action and comedy genres.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-18&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@be3e9a0/media_photos_hq/bullet_train.jpg&quot; alt=&quot;Bullet Train poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 18&lt;b&gt;Bullet Train&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-18&quot;&gt;&lt;span class=&quot;made&quot;&gt;2022 · David Leitch&lt;/span&gt;&lt;p&gt;An unlucky assassin boards a Japanese bullet train to steal a briefcase, only to find several other killers on board, all after the same thing.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure class=&quot;poster&quot; data-still=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@95153d4/media_photos_hq/scene_donnie_darko.jpg&quot; style=&quot;--r:-3deg&quot; data-yt=&quot;-kCauthc8Ow&quot; data-clip=&quot;The ending: “Mad World”&quot; data-why=&quot;As the jet engine finally falls, Gary Jules’ slow piano cover of ‘Mad World’ plays over a montage of the characters waking in the night, as if they half-remember what Donnie did for them. The non-diegetic song anchors the meaning of the images (Barthes): it tells us to read the ending as quiet and sad rather than as a puzzle to solve. Slow motion and cross-cutting between the characters tie all of their stories to his one choice.&quot;&gt;&lt;button class=&quot;frame&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;film-19&quot;&gt;&lt;img src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@4c86924/media_photos_hq/donnie_darko.jpg&quot; alt=&quot;Donnie Darko poster&quot; loading=&quot;lazy&quot;&gt;&lt;/button&gt;&lt;figcaption&gt;Poster 19&lt;b&gt;Donnie Darko&lt;/b&gt;&lt;div class=&quot;desc&quot; id=&quot;film-19&quot;&gt;&lt;span class=&quot;made&quot;&gt;2001 · Richard Kelly&lt;/span&gt;&lt;p&gt;A troubled teenager survives a jet engine crashing into his bedroom after a giant rabbit called Frank lures him outside and tells him the world will end in 28 days.&lt;/p&gt;&lt;/div&gt;&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;/div&gt;

      &lt;figure class=&quot;album&quot; style=&quot;--c1:#03503f; --c2:#e8a24c&quot; data-src=&quot;https://cdn.jsdelivr.net/gh/StefanSendyk/Raqueshi@80f48bc/media_music/chuma.mp3&quot;&gt;

        &lt;p&gt;Over the past two years I have developed a strong interest in video editing. I began editing clips and scenes from different television shows and films, gradually developing my understanding of pacing, transitions, sound and visual storytelling. This hobby eventually led me to build an audience of 5,500 subscribers on TikTok, where I post as &lt;a class=&quot;tt-link&quot; href=&quot;https://www.tiktok.com/@raqueshi&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;@raqueshi&lt;/a&gt;.&lt;/p&gt;
        &lt;p&gt;Although I initially started editing simply because I enjoyed it, the experience taught me how creative decisions can influence an audience and how important it is to understand what makes content engaging.&lt;/p&gt;

      &lt;div class=&quot;chapter-head rv&quot; data-ghost=&quot;05&quot;&gt;
        &lt;span class=&quot;idx ctag&quot;&gt;Chapter 05 &lt;i&gt;/&lt;/i&gt; Why Media Studies&lt;/span&gt;
        &lt;h2&gt;Why&lt;em&gt;Media Studies&lt;/em&gt;&lt;/h2&gt;
      &lt;/div&gt;
      &lt;div class=&quot;copy rv&quot;&gt;
        &lt;p&gt;I believe that my combination of analytical thinking, musical experience, interest in cinematography and practical editing experience gives me a strong foundation for Media Studies. Through this course, I hope to develop these skills further, experiment with different forms of media production and, most importantly, develop my own creative style and understanding of how media can communicate ideas to an audience.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

&lt;script&gt;

  // reel progress counter: how far down the page you are
  const rcN = document.getElementById(&#x27;rc-n&#x27;), rcBar = document.getElementById(&#x27;rc-bar&#x27;);
  const rcUpdate = () =&gt; {
    const h = document.documentElement, p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100;
    rcN.textContent = Math.round(p); rcBar.style.setProperty(&#x27;--s&#x27;, p.toFixed(1) + &#x27;%&#x27;);
  };
  addEventListener(&#x27;scroll&#x27;, rcUpdate, { passive: true }); rcUpdate();

  // viewfinder timecode on the opening reel, running at 24 frames a second
  const vfTc = document.getElementById(&#x27;vf-tc&#x27;), vfStart = performance.now();
  const vfPad = n =&gt; String(n).padStart(2, &#x27;0&#x27;);
  setInterval(() =&gt; {
    const f = Math.floor((performance.now() - vfStart) / (1000 / 24));
    vfTc.textContent = vfPad(Math.floor(f / 86400)) + &#x27;:&#x27; + vfPad(Math.floor(f / 1440) % 60) + &#x27;:&#x27; + vfPad(Math.floor(f / 24) % 60) + &#x27;:&#x27; + vfPad(f % 24);
  }, 1000 / 24);

  // opening reel: fade its text out and brighten the seam line as you scroll into the hero
  const reel = document.querySelector(&#x27;.reel&#x27;);
  if (!matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches) {
    let ticking = false;
    const update = () =&gt; {
      const p = Math.min(Math.max(window.scrollY / (reel.offsetHeight * 0.7), 0), 1);
      reel.style.setProperty(&#x27;--p&#x27;, p.toFixed(3));
      reel.style.setProperty(&#x27;--seam&#x27;, (0.5 + p * 0.5).toFixed(3));
      ticking = false;
    };
    addEventListener(&#x27;scroll&#x27;, () =&gt; { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
    update();
  }

  // background video: respect &quot;reduce motion&quot; and pause it while it&#x27;s scrolled out of view
  const heroVid = document.querySelector(&#x27;video.hero-bg&#x27;);
  if (matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches) heroVid.pause();
  else new IntersectionObserver(([e]) =&gt; { e.isIntersecting ? heroVid.play().catch(() =&gt; {}) : heroVid.pause(); }, { rootMargin: &#x27;300px 0px&#x27; }).observe(heroVid);

  // project videos: play button starts the video (with its controls); full-screen button + close button
  document.querySelectorAll(&#x27;.proj-frame video&#x27;).forEach(vid =&gt; {
    const frame = vid.closest(&#x27;.proj-frame&#x27;);
    const start = () =&gt; { frame.classList.add(&#x27;started&#x27;); vid.controls = true; vid.play(); };
    frame.querySelector(&#x27;.play&#x27;).addEventListener(&#x27;click&#x27;, start);
    frame.querySelector(&#x27;.fs-open&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
      if (!frame.classList.contains(&#x27;started&#x27;)) start();
      if (frame.requestFullscreen) frame.requestFullscreen();
      else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
      else if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();   // iPhone: the phone&#x27;s own player (has a Done button)
    });
    frame.querySelector(&#x27;.fs-close&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    });
  });
  const markFull = () =&gt; {
    const el = document.fullscreenElement || document.webkitFullscreenElement;
    document.querySelectorAll(&#x27;.proj-frame&#x27;).forEach(f =&gt; f.classList.toggle(&#x27;is-full&#x27;, f === el));
  };
  document.addEventListener(&#x27;fullscreenchange&#x27;, markFull);
  document.addEventListener(&#x27;webkitfullscreenchange&#x27;, markFull);

  // prologue: the statement lights up word by word as you scroll through it
  const statement = document.getElementById(&#x27;statement&#x27;);
  statement.querySelectorAll(&#x27;.key&#x27;).forEach(k =&gt; k.dataset.key = &#x27;1&#x27;);
  const words = [];
  const split = node =&gt; {
    [...node.childNodes].forEach(n =&gt; {
      if (n.nodeType === 3) {
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(t =&gt; {
          if (!t) return;
          if (/^\s+$/.test(t)) { frag.append(t); return; }
          const w = document.createElement(&#x27;span&#x27;);
          w.className = &#x27;w&#x27; + (node.dataset &amp;&amp; node.dataset.key ? &#x27; key&#x27; : &#x27;&#x27;);
          w.textContent = t; frag.append(w); words.push(w);
        });
        n.replaceWith(frag);
      } else split(n);
    });
  };
  split(statement);
  if (matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches) words.forEach(w =&gt; w.classList.add(&#x27;lit&#x27;));
  else {
    let busy = false;
    const light = () =&gt; {
      const r = statement.getBoundingClientRect();
      const p = Math.min(Math.max((innerHeight * 0.85 - r.top) / (innerHeight * 0.5), 0), 1);
      const n = Math.round(p * words.length);
      words.forEach((w, i) =&gt; w.classList.toggle(&#x27;lit&#x27;, i &lt; n));
      busy = false;
    };
    addEventListener(&#x27;scroll&#x27;, () =&gt; { if (!busy) { busy = true; requestAnimationFrame(light); } }, { passive: true });
    light();
  }

  // fade sections in as they scroll into view
  const io = new IntersectionObserver(entries =&gt; {
    entries.forEach(e =&gt; { if (e.isIntersecting) { e.target.classList.add(&#x27;in&#x27;); io.unobserve(e.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll(&#x27;.rv&#x27;).forEach(el =&gt; io.observe(el));

  // album records: each disc plays the full song from media_music/.
  // play/pause in the middle, &lt;&lt; goes back to the start of the song, &gt;&gt; skips to the next album
  // (next in the row, then the next row, and from the last album back round to the first)
  // When a song starts, the albums split: the playing one slides to the right and grows into a big player,
  // the others move into a smaller grid on the left.

    if (e.target.closest &amp;&amp; e.target.closest(&#x27;input, textarea, select, [contenteditable], .prog&#x27;)) return;
    const film = document.getElementById(&#x27;film&#x27;).getBoundingClientRect();
    if (film.bottom &lt; 80 || film.top &gt; innerHeight - 80) return;   // only while the film section is on screen
    e.preventDefault();
    // VERSION 46 — the arrows open the next / previous film (round the loop), as if its poster was clicked
    const dir = e.key === &#x27;ArrowRight&#x27; ? 1 : -1, n = posters.length;
    let target;
    if (chosen) target = (+chosen.dataset.i + dir + n) % n;
    else {                                // nothing open yet: start from the first poster on screen
      const r = filmStrip.getBoundingClientRect();
      const lead = stripPosters().find(p =&gt; p.getBoundingClientRect().right &gt; r.left + 40);
      target = (+lead.dataset.i + (dir &gt; 0 ? 0 : -1) + n) % n;
    }
    const pageY = scrollY;                // VERSION 47 — the page itself must not move, only the strip
    arrowOpen = true;
    posters[target].querySelector(&#x27;.frame&#x27;).click();
    arrowOpen = false;
    // then line the strip up so the film after the open one is first in the row (the click has already
    // moved the posters, so this can happen straight away)
    loopStrip();
    const after = posters[(target + 1) % n];  // sideways only: scroll the strip itself, never the page
    const pad = parseFloat(getComputedStyle(filmStrip).paddingLeft) || 0;
    filmStrip.scrollTo({ left: xOf(after), behavior: reduceMotion ? &#x27;auto&#x27; : &#x27;smooth&#x27; });
    if (scrollY !== pageY) scrollTo({ top: pageY, behavior: &#x27;instant&#x27; });
  });

  // menu bar: gets a background once you&#x27;re past the opening reel, and underlines the part you&#x27;re reading
  const nav = document.getElementById(&#x27;nav&#x27;);
  const navLinks = [...nav.querySelectorAll(&#x27;.links a&#x27;)];
  const parts = [[&#x27;about&#x27;, &#x27;about&#x27;], [&#x27;intro&#x27;, &#x27;about&#x27;], [&#x27;film&#x27;, &#x27;film&#x27;], [&#x27;music&#x27;, &#x27;music&#x27;], [&#x27;editing&#x27;, &#x27;editing&#x27;],
                 [&#x27;why&#x27;, &#x27;about&#x27;], [&#x27;my-projects&#x27;, &#x27;projects&#x27;], [&#x27;projects&#x27;, &#x27;projects&#x27;]]
    .map(([id, key]) =&gt; [document.getElementById(id), key]);
  let navBusy = false;
  function navState() {
    nav.classList.toggle(&#x27;solid&#x27;, scrollY &gt; reel.offsetHeight - 60);
    let key = null;
    parts.forEach(([el, k]) =&gt; { if (el.getBoundingClientRect().top &lt; innerHeight * 0.4) key = k; });
    navLinks.forEach(a =&gt; a.classList.toggle(&#x27;on&#x27;, a.dataset.for === key));
    navBusy = false;
  }
  addEventListener(&#x27;scroll&#x27;, () =&gt; { if (!navBusy) { navBusy = true; requestAnimationFrame(navState); } }, { passive: true });
  addEventListener(&#x27;resize&#x27;, navState);
  navState();

  // audio waveforms for the editing timeline
  document.querySelectorAll(&#x27;.wave&#x27;).forEach(w =&gt; {
    const n = +w.dataset.bars;
    for (let i = 0; i &lt; n; i++) {
      const bar = document.createElement(&#x27;i&#x27;);
      const h = 20 + Math.abs(Math.sin(i * 0.55) * 50) + Math.random() * 30;
      bar.style.height = Math.min(h, 100) + &#x27;%&#x27;;
      w.appendChild(bar);
    }
  });

  // preview clips: each one starts from its first frame when the playhead reaches it, like a real edit.
  // They only play while the timeline is on screen, and stay still if the visitor prefers less motion.
  let previewOn = false;
  function startClip(v) {
    if (!previewOn) return;
    v.currentTime = 0;
    v.play().catch(() =&gt; {});
  }
  if (!reduceMotion) new IntersectionObserver(([e]) =&gt; {
    previewOn = e.isIntersecting;
    const v = document.querySelector(&#x27;#preview video.show&#x27;);
    if (previewOn) v.play().catch(() =&gt; {});
    else document.querySelectorAll(&#x27;#preview video&#x27;).forEach(x =&gt; x.pause());
  }).observe(document.getElementById(&#x27;preview&#x27;));

  // running timecode + preview window that follows the playhead
  const tc = document.getElementById(&#x27;tc&#x27;);
  const shots = document.querySelectorAll(&#x27;#preview video&#x27;);
  const names = [&#x27;V1 — Fight Club&#x27;, &#x27;V1 — Into the Wild&#x27;, &#x27;V2 — Glendale Archives&#x27;, &#x27;V1 — Pacific Rim&#x27;];
  const label = document.getElementById(&#x27;clipname&#x27;);
  const loop = 14000;
  const start = performance.now();
  let current = 0;
  function tick(now) {
    const t = ((now - start) % loop) / loop;          // 0 → 1, in sync with the CSS playhead
    const frames = Math.floor(t * 14 * 25);
    const s = Math.floor(frames / 25), f = frames % 25;
    tc.textContent = &#x27;00:00:&#x27; + String(s).padStart(2, &#x27;0&#x27;) + &#x27;:&#x27; + String(f).padStart(2, &#x27;0&#x27;);
    const shot = t &lt; 0.245 ? 0 : t &lt; 0.44 ? 1 : t &lt; 0.72 ? 2 : 3;
    if (shot !== current) {
      const prev = shots[current];
      prev.classList.remove(&#x27;show&#x27;);
      setTimeout(() =&gt; { if (!prev.classList.contains(&#x27;show&#x27;)) prev.pause(); }, 650);   // keep it moving while it fades out
      shots[shot].classList.add(&#x27;show&#x27;);
      startClip(shots[shot]);
      label.textContent = names[shot];
      current = shot;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // figures: the ones with data-d drift a little at their own speed while you scroll
  if (!reduceMotion) {
    const layers = [...document.querySelectorAll(&#x27;.fx&#x27;)].map(f =&gt; [f, [...f.querySelectorAll(&#x27;[data-d]&#x27;)]]).filter(([, els]) =&gt; els.length);
    let figBusy = false;
    const drift = () =&gt; {
      layers.forEach(([f, els]) =&gt; {
        const r = f.getBoundingClientRect();
        if (r.bottom &lt; -200 || r.top &gt; innerHeight + 200) return;
        const off = r.top + r.height / 2 - innerHeight / 2;
        els.forEach(el =&gt; el.style.setProperty(&#x27;--py&#x27;, (-off * +el.dataset.d).toFixed(1) + &#x27;px&#x27;));
      });
      figBusy = false;
    };
    addEventListener(&#x27;scroll&#x27;, () =&gt; { if (!figBusy) { figBusy = true; requestAnimationFrame(drift); } }, { passive: true });
    drift();
  }
&lt;/script&gt;
&lt;script&gt;
  /* VERSION 72 — faster video start: nothing big downloads while the page opens. The hero loop starts loading just
     before you scroll to it (it no longer autoplays from the top of the page), the four editing-timeline clips only
     load when the Editing chapter comes near, and the three project videos get their first bytes ready when the
     projects come near, so they start quickly when you press play. Their cover pictures show until then. */
  (function () {
    function near(el, margin, fn) {
      if (!el) return;
      if (!(&#x27;IntersectionObserver&#x27; in window)) { fn(); return; }
      var o = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { o.disconnect(); fn(); } }, { rootMargin: margin });
      o.observe(el);
    }
    near(document.getElementById(&#x27;preview&#x27;), &#x27;600px 0px&#x27;, function () {
      document.querySelectorAll(&#x27;#preview video&#x27;).forEach(function (v) { v.preload = &#x27;auto&#x27;; v.load(); });
    });
    near(document.getElementById(&#x27;projects&#x27;), &#x27;400px 0px&#x27;, function () {
      document.querySelectorAll(&#x27;.proj-frame video&#x27;).forEach(function (v) { if (v.preload === &#x27;none&#x27;) v.preload = &#x27;metadata&#x27;; });
    });
  })();
&lt;/script&gt;
&lt;script&gt;
  // VERSION 77 — the ↓ under each project opens / closes its writing box
  document.querySelectorAll(&#x27;.more-btn&#x27;).forEach(function (btn) {
    var box = document.getElementById(btn.getAttribute(&#x27;aria-controls&#x27;));
    btn.addEventListener(&#x27;click&#x27;, function () {
      var open = box.classList.toggle(&#x27;open&#x27;);
      btn.setAttribute(&#x27;aria-expanded&#x27;, open ? &#x27;true&#x27; : &#x27;false&#x27;);
    });
  });
&lt;/script&gt;
&lt;script&gt;
  // VERSION 81 / PRELIM 67 — the project films load from the internet (jsDelivr), so they play on any computer.
  // If an online link ever fails, each one falls back to its file in media_photos_hq next to this page.
  document.querySelectorAll(&#x27;video[data-local]&#x27;).forEach(function (v) {
    v.addEventListener(&#x27;error&#x27;, function () {
      if (v.dataset.tried) return;
      v.dataset.tried = &#x27;1&#x27;;
      v.src = v.dataset.local;
      if (v.dataset.localPoster) v.poster = v.dataset.localPoster;
      v.load();
    });
  });
&lt;/script&gt;
&lt;/body&gt;
